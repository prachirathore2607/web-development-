<!DOCTYPE html>
<html>
<head>
<title>Colorful Web Project</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
padding:0;
scroll-behavior:smooth;
background:linear-gradient(120deg, #89f7fe, #66a6ff);
color:#222;
transition:0.4s;
}

/* Dark Mode */
.dark{
background:#0f172a;
color:#f1f5f9;
}

/* Button */
button{
padding:10px 15px;
cursor:pointer;
border:none;
background:linear-gradient(45deg,#ff7e5f,#feb47b);
color:white;
border-radius:20px;
margin:10px;
font-weight:bold;
}

/* Navbar */
nav{
background:linear-gradient(90deg,#141e30,#243b55);
padding:15px;
text-align:center;
}

nav a{
color:#f8fafc;
margin:15px;
text-decoration:none;
font-size:18px;
transition:0.3s;
}

nav a:hover{
color:#ff7e5f;
}

/* Sections */
section{
min-height:100vh;
padding:40px;
border-radius:20px;
margin:20px;
}

/* Different colors */
#home{
background:linear-gradient(120deg,#f6d365,#fda085);
}

#about{
background:linear-gradient(120deg,#84fab0,#8fd3f4);
}

#contact{
background:linear-gradient(120deg,#cfd9df,#e2ebf0);
}

/* Form */
form{
width:300px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:10px;
}

input:focus{
border-color:#ff7e5f;
outline:none;
}

/* Error */
.error{
color:#e63946;
font-weight:bold;
}

</style>

</head>

<body>

<button id="modeBtn">🌙 Dark Mode</button>

<nav>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</nav>

<section id="home">
<h1>✨ Welcome to My Website</h1>
<p>This webpage demonstrates modern UI with colors:</p>

<ul>
<li>🌙 Dark Mode Toggle</li>
<li>🚀 Smooth Scrolling</li>
<li>✅ Form Validation</li>
</ul>
</section>

<section id="about">
<h1>💡 About Section</h1>
<p>This section shows smooth scrolling navigation.</p>
</section>

<section id="contact">
<h1>📩 Contact Form</h1>

<form id="form">

<input type="text" id="name" placeholder="Enter your name">
<input type="email" id="email" placeholder="Enter your email">
<input type="text" id="phone" placeholder="Enter phone number">

<button type="submit">Submit</button>

</form>

<p id="error" class="error"></p>

</section>

<script>

// Dark Mode
const modeBtn = document.getElementById("modeBtn");

modeBtn.addEventListener("click", () => {
document.body.classList.toggle("dark");
});

// Form Validation
const form = document.getElementById("form");

form.addEventListener("submit", function(e){

e.preventDefault();

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const phone = document.getElementById("phone").value.trim();

const error = document.getElementById("error");

error.textContent = "";

if(!name || !email || !phone){
error.textContent = "⚠ All fields are required";
return;
}

if(phone.length !== 10 || isNaN(phone)){
error.textContent = "⚠ Enter valid 10-digit phone number";
return;
}

alert("🎉 Form Submitted Successfully");
form.reset();

});

</script>

</body>
</html>
